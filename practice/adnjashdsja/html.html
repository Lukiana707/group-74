<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NAILIFE</title>

  <!-- Handwritten / bubble‑style font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nakdnksa.css">

  <style>
    body {
      margin: 0;
      background: #f7c2c2;
      font-family: 'Baloo 2', cursive;
    }

    /* TOP LEFT CORNER — tight placement */
    .brand {
      position: absolute;
      top: 5px;
      left: 5px;
      font-size: 32px; /* smaller overall */
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      display: flex;
      gap: 1px;
    }

    /* Smaller IFE */
    .tiny {
      font-size: 0.55em;
      transform: translateY(4px);
    }

    /* Colors */
    .pink { color: #ff7ac4; }
    .blue { color: #6ecbff; }
    .yellow { color: #ffe66d; }

    /* Bubble-ish effect */
    .brand span {
      text-shadow:
        0 0 3px rgba(0,0,0,0.15),
        0 2px 0 rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>
  <div class="brand">
    <span class="pink">N</span>
    <span class="blue">A</span>
    <span class="yellow">I</span>
    <span class="pink">L</span>

    <span class="blue tiny">I</span>
    <span class="yellow tiny">F</span>
    <span class="pink tiny">E</span>

    <div  id="caca">  </div>

  </div>
</body>
</html>
